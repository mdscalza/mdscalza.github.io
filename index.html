<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael's Rankings</title>
    <style>
        body { 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #121212; 
            color: #e0e0e0; 
            line-height: 1.6;
        }
        nav { 
            background: #1f1f1f; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 30px; 
            text-align: center;
            border: 1px solid #333;
            position: sticky;
            top: 10px;
        }
        nav a { color: #bb86fc; text-decoration: none; margin: 0 15px; font-weight: bold; }
        nav a:hover { color: #03dac6; }
        .content { background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #ffffff; }
        .rank-item { display: flex; align-items: flex-start; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #333; }
        .rank-item img { width: 80px; height: 120px; object-fit: cover; border-radius: 8px; margin-right: 20px; background-color: #333; }
        .rank-text h3 { margin: 0 0 8px 0; color: #ffffff; }
        .rank-text p { margin: 0; font-size: 0.95em; color: #b0b0b0; }
        .about-section { margin-top: 50px; padding: 20px; background: #252525; border-radius: 12px; border-left: 4px solid #bb86fc; }
        .about-section h2 { margin-top: 0; color: #bb86fc; }
        footer { text-align: center; margin-top: 40px; font-size: 0.85em; color: #777; padding-bottom: 20px; }
    /* Letterboxd Button Styling */
.lb-button {
    background-color: #00e705; /* Letterboxd Green */
    color: #121212 !important;
    padding: 5px 15px;
    border-radius: 20px;
    transition: transform 0.2s;
}
.lb-button:hover {
    background-color: #40bcf4; /* Letterboxd Blue on hover */
    transform: scale(1.05);
}
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="tv.html">TV</a>
        <a href="movies.html">Movies</a>
        <a href="https://letterboxd.com/sclizzy/" target="_blank" class="lb-button">Letterboxd</a>
    </nav>

    <div class="content">
        <h1>Michael's Rankings</h1>

        <div class="about-section">
            <h2>About Michael</h2>
            <p>I'm Michael Scalza, and this is my personal space for ranking the greatest media ever created. From cinematic masterpieces to binge-worthy TV, these are the picks that define my taste.</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Michael Scalza | <span id="last-updated"></span></p>
    </footer>

    <script>
        // This script automatically shows when you last pushed changes
        document.getElementById('last-updated').innerHTML = "Last updated: " + document.lastModified;
    </script>

</body>
</html>
